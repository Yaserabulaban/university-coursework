{% extends "app/layout.html" %}

{% block content %}
<h2>Create New Vendor</h2>

<form method="POST">
    {% csrf_token %}
    <h3>User Information</h3>
    {{ user_form.as_p }}

    {{ vendor_form.as_p }}

    <button type="submit">Register</button>
</form>

{% endblock %}
