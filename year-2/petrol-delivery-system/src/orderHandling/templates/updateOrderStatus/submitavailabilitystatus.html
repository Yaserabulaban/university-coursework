{% extends "app/layout.html" %}
{% block content %}
<br>
<h2><strong>Submit Fuel Availability</strong></h2>

<form method="post" action="{% url 'submitavailabilitystatus' %}">
    {% csrf_token %}
    
    <div>
        <label for="petrol_type">Fuel Type:</label>
        <select id="petrol_type" name="petrol_type" required>
            <option value="">Select Fuel Type</option>
            <option value="RON95">RON 95</option>
            <option value="RON97">RON 97</option>
            <option value="RON100">RON 100</option>
            <option value="Diesel">Diesel</option>
        </select>
    </div>

    <div>
        <label for="quantity">Quantity (liters):</label>
        <input type="number" id="quantity" name="quantity" required min="1">
    </div>

    <div>
        <label for="price">Price per liter (RM):</label>
        <input type="number" id="price" name="price" required min="0.01" step="0.01">
    </div>

    <button class="btn btn-info" type="submit">Submit</button>
</form>
<br>

{% if message %}
    <p style="color: green;"><strong>{{ message }}</strong></p>
{% elif error %}
    <p style="color: red;"><strong>{{ error }}</strong></p>
{% endif %}
<a href="{% url 'menu' %}">
    <button class="btn btn-info">Return to Home</button>
</a>

{% endblock %}
